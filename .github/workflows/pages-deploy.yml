name: Build and deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.20.0

      - name: Install Typst
        uses: taiki-e/install-action@v2
        with:
          tool: typst-cli@0.15.0

      - name: Build site
        run: zola build

      # The CV is only published once cv/cv.typ has no TODO placeholders left.
      - name: Build CV
        run: |
          if grep -q 'TODO' cv/cv.typ; then
            echo "cv/cv.typ still has TODOs; skipping the CV PDF."
            typst compile cv/cv.typ /tmp/cv-check.pdf   # still fail the build on Typst errors
          else
            typst compile cv/cv.typ public/franco-chalissery-cv.pdf
          fi

      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
